<h4>Traduzione in Norreno</h4>
<p>&quot;Buonanotte nonno&quot; in norreno (antico nordico) si traduce così:
<strong>Góða nótt, afi</strong></p>
<ul>
<li><strong>Góða nótt</strong> : Buona notte.</li>
<li><strong>Afi</strong> : Nonno (termine usato tradizionalmente per indicare il nonno, in generale).</li>
</ul>
